[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localai"
version = "0.1.0"
description = "Local-first private AI assistant on SLMs, self-hosted via Ollama"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.11",
    "litellm>=1.98.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.52.4",
]

[tool.hatch.build.targets.wheel]
only-include = ["config.py", "main.py", "router", "services", "db", "schemas", "repository", "prompts"]
