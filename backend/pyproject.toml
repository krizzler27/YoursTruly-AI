[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "YoursTruly-AI"
version = "0.1.0"
description = "Local-first private AI assistant on SLMs, inference with llama.cpp"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub",
    "jinja2>=3.1.6",
    "lancedb>=0.38.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "llama-cpp-python>=0.3.35",
    "psutil",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.52.4",
]

[tool.hatch.build.targets.wheel]
only-include = ["config.py", "main.py", "core", "router", "services", "db", "schemas", "repository", "prompts"]

[tool.uv.sources]
llama-cpp-python = { index = "llama-vulkan" }

[[tool.uv.index]]
name = "llama-vulkan"
url = "https://abetlen.github.io/llama-cpp-python/whl/vulkan"
